name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP: ${{ github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@v4
      - if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: env.SKIP != 'true'
        run: pip install -e ".[dev]"
      - if: env.SKIP != 'true'
        run: ruff check .
      - if: env.SKIP != 'true'
        run: ruff format --check .
      - if: env.SKIP != 'true'
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@v4
      - if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: env.SKIP != 'true'
        run: pip install -e ".[dev]"
      - if: env.SKIP != 'true'
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@v4
      - if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: env.SKIP != 'true'
        run: pip install build twine
      - if: env.SKIP != 'true'
        run: python -m build
      - if: env.SKIP != 'true'
        run: twine check dist/*
