name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal example
      description: The shortest script that reproduces the problem.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "meta-hpo 0.1.0, numpy 2.2, Python 3.13, Ubuntu 24.04"
    validations:
      required: true
