[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "meta-hpo"
version = "0.2.1"
description = "Metaheuristic hyperparameter optimization: a fast numpy core with an ask/tell interface."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Muhammet Ozdemir", email = "mr.ozdemir34@gmail.com" }]
keywords = ["hyperparameter optimization", "metaheuristics", "artificial bee colony", "automl"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Repository = "https://github.com/mr-ozdemir/meta-hpo"

[tool.hatch.build.targets.wheel]
packages = ["src/metahpo"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
files = ["src/metahpo"]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "pyproject.toml"]
